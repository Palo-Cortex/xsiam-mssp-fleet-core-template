# ============================================================================
# converge.yml — make a ring's tenants match that ring's pins
# ----------------------------------------------------------------------------
# Merging a change to fleet/pins/<ring>.yml on main IS the deploy authorisation
# — there is no separate "deploy" button. The plan job works out which tenants
# the push affects; each tenant then converges in its own job, via demisto-sdk,
# with ONLY its own credentials, under its ring's GitHub Environment.
#
# SAFETY: converge runs a DRY-RUN by default (prints the plan, touches no
# tenant, needs no secrets). It only performs a live --apply when the repo
# variable FLEET_LIVE == 'true'.
#
# PLAN (scripts/plan_converge.py):
#   * push      -> tenants of every ring whose pin file changed ANYWHERE in the
#                  push (before..after, not just the last commit), plus rings /
#                  tenants pinning a changed Packs/ pack to `local`, plus the
#                  tenants a changed Config Overlay layer composes into.
#   * dispatch  -> every tenant of the chosen ring.
#   * CHANGE WINDOW re-check: a ring with require_change_window is dropped
#     outside its window (the `blocked` job then fails the run so it's visible)
#     unless the push only rolls the ring back to versions it already ran, or a
#     dispatch sets break_glass. While FLEET_LIVE is off every run is a dry-run,
#     so nothing is withheld — the window is shown as a notice instead. ring-gate checks the window when the PR is
#     tested; this catches PRs merged later than that.
#
# ROLLOUT: tenants with `canary: true` converge first (`canary` job); the rest
# (`fleet` job) start only if every canary succeeded, at most
# rings.<ring>.max_parallel at a time. One tenant failing never cancels others
# in the same wave (fail-fast: false).
#
# SECRETS: each tenant job maps only secrets.<credentials_ref>_CREDS (see
# converge-tenant.yml) and runs in rings.<ring>.environment from policies.yml —
# put prod tenants' secrets in the fleet-prod Environment and add required
# reviewers there; nonprod jobs then cannot read them.
#
# RELEASE BEFORE CONVERGE: the first job calls release.yml, which publishes any
# MSSP pack version under Packs/ that has no release zip yet, so a pack bump and
# its pin can land in one push. If it fails, nothing converges until the broken
# pack is fixed.
#
# ONE RUN AT A TIME: runs for main queue in order (`queue: max` holds up to 100
# waiting runs instead of GitHub's default of one). Where `queue:` isn't
# supported (GitHub Enterprise Server) the workflow fails validation — drop the
# line and accept that a burst of merges can cancel a waiting run.
# ============================================================================
name: converge

on:
  push:
    branches: [main]
    paths: ["fleet/pins/**", "Packs/**", "fleet/config_overlays/**"]
  workflow_dispatch:
    inputs:
      ring:
        description: "Ring to converge"
        required: true
        default: dev
        type: choice
        options: [dev, qa, prod]
      break_glass:
        description: "Deploy a change-windowed ring OUTSIDE its window (emergency only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: converge-${{ github.ref }}
  cancel-in-progress: false
  queue: max                # up to 100 waiting runs, in order, instead of 1 (GitHub.com only)

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  plan:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.plan.outputs.canary }}
      fleet: ${{ steps.plan.outputs.fleet }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      blocked: ${{ steps.plan.outputs.blocked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }        # whole push diff + pin history (rollback check)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml

      - name: Plan tenants
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISPATCH_RING: ${{ inputs.ring }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          FLEET_LIVE: ${{ vars.FLEET_LIVE }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --after "$AFTER")
          # A dry-run deploys nothing, so change windows don't withhold it.
          [ "${FLEET_LIVE:-}" = "true" ] || args+=(--dry-run)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--ring "$DISPATCH_RING")
            [ "$BREAK_GLASS" = "true" ] && args+=(--break-glass) \
              && echo "::warning::BREAK-GLASS converge of ring '$DISPATCH_RING' outside its change window"
          else
            args+=(--before "$BEFORE")
          fi
          python scripts/plan_converge.py "${args[@]}" > plan.json
          cat plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("plan.json"))
          for k in ("canary", "fleet", "blocked"):
              print(f"{k}={json.dumps(p[k])}")
          print(f"max_parallel={p['max_parallel']}")
          PY
          python - <<'PY'
          import json
          for n in json.load(open("plan.json")).get("notes", []):
              print(f"::notice::{n}")
          PY

  canary:
    needs: plan
    if: needs.plan.outputs.canary != '[]'
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJson(needs.plan.outputs.canary) }}
    uses: ./.github/workflows/converge-tenant.yml
    with:
      tenant: ${{ matrix.t.tenant }}
      credentials_ref: ${{ matrix.t.credentials_ref }}
      environment: ${{ matrix.t.environment }}
    secrets: inherit

  fleet:
    needs: [plan, canary]
    # run when there is a fleet wave and the canary wave passed or had nothing to do
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.fleet != '[]' &&
      (needs.canary.result == 'success' || needs.canary.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan.outputs.max_parallel) }}
      matrix:
        t: ${{ fromJson(needs.plan.outputs.fleet) }}
    uses: ./.github/workflows/converge-tenant.yml
    with:
      tenant: ${{ matrix.t.tenant }}
      credentials_ref: ${{ matrix.t.credentials_ref }}
      environment: ${{ matrix.t.environment }}
    secrets: inherit

  blocked:
    # Rings dropped by the change-window re-check: fail loudly so the merged
    # but undeployed pins are visible. Re-run converge for that ring (dispatch)
    # inside a window, or with break_glass in an emergency.
    needs: plan
    if: needs.plan.outputs.blocked != '[]'
    runs-on: ubuntu-latest
    steps:
      - env:
          BLOCKED: ${{ needs.plan.outputs.blocked }}
        run: |
          echo "::error::converge withheld for: $BLOCKED"
          exit 1
