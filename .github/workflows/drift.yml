# ============================================================================
# drift.yml — fleet drift detection
# ----------------------------------------------------------------------------
# Only performs work if the FLEET_LIVE repo variable is 'true'.
#
#   plan    list every tenant with its credentials_ref and ring Environment
#   fetch   one job PER TENANT, in that tenant's Environment, with ONLY that
#           tenant's secret: read installed packs (update_installed_state.py)
#           and upload a one-tenant installed_state artifact
#   report  merge the artifacts, compare RESOLVED (ring pins) vs installed, and
#           open — or update — a single `drift` issue
#
# Reports only — drift never deletes (that's converge's orphan step).
# Customer-prefixed content is ignored by the checker. A tenant whose fetch
# fails is listed in the report as unreachable instead of aborting the run.
# ============================================================================
name: drift

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  plan:
    if: vars.FLEET_LIVE == 'true'
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.plan.outputs.tenants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          from pathlib import Path
          pol = (yaml.safe_load(open("fleet/policies.yml")) or {}).get("rings") or {}
          out = []
          for f in sorted(Path("fleet/tenants").glob("*.yml")):
              t = yaml.safe_load(f.read_text()) or {}
              out.append({"tenant": f.stem,
                          "credentials_ref": t.get("credentials_ref") or f.stem.upper(),
                          "environment": (pol.get(t.get("ring")) or {}).get("environment") or ""})
          print(f"tenants={json.dumps(out)}")
          PY

  fetch:
    needs: plan
    if: needs.plan.outputs.tenants != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.t.environment }}
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJson(needs.plan.outputs.tenants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml
      - name: Installed state for ${{ matrix.t.tenant }}
        env:
          TENANT: ${{ matrix.t.tenant }}
          FLEET_TENANT_CREDS: ${{ secrets[format('{0}_CREDS', matrix.t.credentials_ref)] }}
          FLEET_TENANT_BASE_URL: ${{ secrets[format('{0}_BASE_URL', matrix.t.credentials_ref)] }}
          FLEET_TENANT_API_KEY: ${{ secrets[format('{0}_API_KEY', matrix.t.credentials_ref)] }}
          FLEET_TENANT_AUTH_ID: ${{ secrets[format('{0}_AUTH_ID', matrix.t.credentials_ref)] }}
        run: |
          set -euo pipefail
          eval "$(python scripts/load_creds.py "$TENANT")"
          python scripts/update_installed_state.py -t "$TENANT"
          mkdir -p state && mv installed_state.yml "state/$TENANT.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-${{ matrix.t.tenant }}
          path: state/
          retention-days: 7

  report:
    needs: [plan, fetch]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: state-*
          path: state
          merge-multiple: true

      - name: Merge installed state
        env:
          TENANTS: ${{ needs.plan.outputs.tenants }}
        run: |
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          merged = {}
          for f in sorted(Path("state").glob("*.yml")) if Path("state").exists() else []:
              merged.update(yaml.safe_load(f.read_text()) or {})
          wanted = [t["tenant"] for t in json.loads(os.environ["TENANTS"])]
          missing = [t for t in wanted if t not in merged]
          Path("installed_state.yml").write_text(yaml.safe_dump(merged) if merged else "")
          Path("unreachable.json").write_text(json.dumps(missing))
          print(f"state for {len(merged)} tenant(s); unreachable: {missing or 'none'}")
          PY

      - name: Check drift
        id: check
        run: |
          if [ ! -s installed_state.yml ]; then
            echo "no installed state fetched — skipping drift check"
            echo '{"reports": [], "total_drift": 0}' > drift.json
            echo "drift=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python scripts/drift_check.py --state installed_state.yml --json > drift.json
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          python scripts/drift_check.py --state installed_state.yml || true

      # One open `drift` issue at a time: updated in place, not duplicated.
      - name: Open or update the drift issue
        if: steps.check.outputs.drift != '0' || hashFiles('unreachable.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('drift.json', 'utf8'));
            const unreachable = JSON.parse(fs.readFileSync('unreachable.json', 'utf8'));
            if (!data.total_drift && unreachable.length === 0) return;
            const label = 'drift';
            const { owner, repo } = context.repo;
            try {
              try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
              catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name: label,
                  color: 'd73a4a', description: 'Tracks fleet drift detection' });
              }
              const lines = data.reports.flatMap(r => r.drift.map(d =>
                `- **${r.tenant}** \`${d.pack}\`: installed ${d.installed ?? 'none'} ≠ resolved ${d.pinned}`));
              const unr = unreachable.map(t => `- **${t}**: installed state could not be fetched`);
              const body = [
                `_Updated ${new Date().toISOString()} by [drift run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})._`,
                '', lines.length ? '### Drift' : '', ...lines,
                '', unr.length ? '### Unreachable tenants' : '', ...unr,
              ].join('\n');
              const title = `Fleet drift detected (${data.total_drift} pack(s)` +
                            (unr.length ? `, ${unr.length} unreachable)` : ')');
              const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open' });
              if (open.data.length) {
                await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, title, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              }
            } catch (e) {
              core.warning(`Drift found, but the issue could not be written: ${e.message}`);
            }

      - name: Summary
        env:
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          if [ "$DRIFT" != "0" ]; then
            echo "Drift found and reported via an issue (job intentionally green)."
          else
            echo "Fleet in sync."
          fi
