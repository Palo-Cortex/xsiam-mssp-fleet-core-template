# ============================================================================
# drift.yml — fleet drift detection
# ----------------------------------------------------------------------------
# Compares each tenant's RESOLVED versions (ring pins) against installed
# versions and opens an issue on drift. Reports only — drift never deletes
# (that's converge's orphan step). Customer-prefixed content is
# ignored by the checker.
#
# workflow_dispatch only. The daily schedule is intentionally disabled
# because the installed-state is still a committed fixture — a nightly run would
# open a duplicate drift issue every day. Re-enable `schedule:` once the fixture
# step is replaced with a real per-tenant fetch (GET /contentpacks/metadata/
# installed) into the same {tenant: {id: version}} shape.
# ============================================================================
name: drift

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 13 * * *"   # enable when installed-state is fetched live

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml

      # When going live: replace this fixture copy with a real per-tenant fetch
      # (GET /contentpacks/metadata/installed per tenant) into the same shape.
      - name: Build installed-state
        run: cp fixtures/installed_state.sample.yml installed_state.yml

      - name: Check drift
        id: check
        run: |
          set +e
          python scripts/drift_check.py --state installed_state.yml --json > drift.json
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          python scripts/drift_check.py --state installed_state.yml || true

      # Report-only: open an issue when drift is found. The `drift` label must
      # exist in the repo — GitHub's issue API does not auto-create labels.
      - name: Open issue on drift
        if: steps.check.outputs.drift != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('drift.json', 'utf8'));
            const lines = data.reports.flatMap(r =>
              r.drift.map(d => `- **${r.tenant}** \`${d.pack}\`: installed ${d.installed ?? 'none'} ≠ resolved ${d.pinned}`));
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Fleet drift detected (${data.total_drift} pack(s))`,
              body: lines.join('\n') + '\n\n_Filed by the drift workflow._',
              labels: ['drift'],
            });

      # Drift is a report, not a build failure — the job stays green so the
      # Actions tab isn't perpetually red. It fails only on an unexpected error.
      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.drift }}" != "0" ]; then
            echo "Drift found and reported via an issue (job intentionally green)."
          else
            echo "Fleet in sync."
          fi
