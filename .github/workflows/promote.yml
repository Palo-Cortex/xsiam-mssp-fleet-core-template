# ============================================================================
# promote.yml — copy a pin forward into the next ring, as a reviewable PR
# ----------------------------------------------------------------------------
# Promotion is a pin-copy PR, not a console action: this edits the target
# ring's pin file via scripts/promote.py, locks the artifact (lock.py) and opens
# a PR. Merging that PR is what authorises `converge` for the target ring — and
# the PR must pass `ring-gate` (no-skip, soak, change window) first.
#
# TOKEN: PRs opened with the default GITHUB_TOKEN do NOT trigger other
# workflows, so ring-gate would never report and the PR would sit blocked. Set
# up a GitHub App (contents + pull-requests: write) and store
#   vars.FLEET_APP_ID  and  secrets.FLEET_APP_PRIVATE_KEY
# — the PR is then opened as the App and ring-gate runs normally. Without them
# the workflow still opens the PR but warns that ring-gate must be re-triggered
# (push an empty commit, or close + reopen the PR).
# ============================================================================
name: promote

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: "Pack id to promote (e.g. VirusTotal)"
        required: true
      to_ring:
        description: "Target ring"
        required: true
        default: qa
        type: choice
        options: [qa, prod]
      version:
        description: "Version (optional — defaults to the source ring's current pin)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # Inputs reach shell only through env (never ${{ }} inside run:), and are
      # validated before use in a branch name or command line.
      - name: Validate inputs
        env:
          PACK: ${{ inputs.pack_id }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$PACK" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || { echo "::error::invalid pack id"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([.-][A-Za-z0-9.]+)?$ ]] \
            || { echo "::error::invalid version"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml

      - name: Copy the pin forward
        env:
          PACK: ${{ inputs.pack_id }}
          TO: ${{ inputs.to_ring }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(--pack "$PACK" --to "$TO")
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          python scripts/promote.py "${args[@]}"

      - name: Lock the promoted artifact
        # Records zip URL + sha256 in fleet/artifacts.lock.yml if not already
        # there, so require_lock rings deploy verified bytes. MSSP release
        # assets on this (private) repo are read with the workflow token.
        # A lock failure only fails the run when the target ring requires locks.
        env:
          PACK: ${{ inputs.pack_id }}
          TO: ${{ inputs.to_ring }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python scripts/lock.py --write --pack "$PACK" && exit 0
          if (cd scripts && python -c "import sys, lock; sys.exit(0 if lock.ring_requires_lock(sys.argv[1]) else 1)" "$TO"); then
            echo "::error::ring '$TO' requires a lock entry and $PACK could not be locked (see above)"
            exit 1
          fi
          echo "::warning::could not lock $PACK; ring '$TO' doesn't require locks, continuing"

      - name: GitHub App token (so ring-gate runs on the PR)
        id: app
        if: vars.FLEET_APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}

      - name: Open PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: promote/${{ inputs.pack_id }}-to-${{ inputs.to_ring }}
          title: "promote: ${{ inputs.pack_id }} → ${{ inputs.to_ring }}"
          body: |
            Copies `${{ inputs.pack_id }}` forward into `fleet/pins/${{ inputs.to_ring }}.yml`
            and records its artifact in `fleet/artifacts.lock.yml`.

            Merging authorises `converge` for the **${{ inputs.to_ring }}** ring.
            `ring-gate` must pass first (no-skip, soak days, change window).
          labels: promotion

      - name: Warn when ring-gate won't trigger
        if: vars.FLEET_APP_ID == ''
        run: |
          echo "::warning::PR opened with GITHUB_TOKEN — GitHub won't start ring-gate for it. Configure vars.FLEET_APP_ID + secrets.FLEET_APP_PRIVATE_KEY, or re-trigger the check (close/reopen the PR)."
