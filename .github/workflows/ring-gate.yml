# ============================================================================
# ring-gate.yml — the required check on every PR that touches the fleet
# ----------------------------------------------------------------------------
# One path-aware check enforces per-ring promotion policy (no-skip, soak days,
# change windows, break-glass rollback) from fleet/policies.yml, plus the fleet
# half of the namespace contract, a resolve validation that fails on any
# unpinned pack, the artifact lock, a check that every pinned MSSP pack version
# has (or is about to get) a release, and the pytest suite under tests/.
#
# Mark the `gate` job as a REQUIRED status check in branch protection.
#
# TRUST: the ring policy step runs scripts/ring_gate.py taken from the BASE
# branch, not from the PR — otherwise a PR could edit the gate to pass itself.
# Policy, soak history and source-ring pins are also read from base. Pair this
# with CODEOWNERS on scripts/, .github/ and fleet/policies.yml so changes to the
# gate itself get the right reviewers.
#
# MERGE QUEUE (recommended for prod change windows): enable it on main and this
# workflow re-runs on `merge_group`, i.e. at merge time, so a PR that went green
# inside a window can't merge outside it. converge re-checks the window too.
#
# No `paths:` filter: a required check that never reports blocks the PR, and
# workflow/script changes must be gated as well.
# ============================================================================
name: ring-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # `rollback` label re-evaluates
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }        # soak is measured from base-branch history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -c requirements-ci.txt pyyaml pytest textual

      - name: Tests
        run: pytest -q

      - name: Resolve validation (every tenant, every ring — fails on unpinned)
        run: |
          for pin in fleet/pins/*.yml; do
            python scripts/resolve.py --ring "$(basename "$pin" .yml)" --json > /dev/null
          done
          echo "all tenants resolve against their ring pins ✓"

      - name: Namespace contract (fleet side)
        run: python scripts/namespace_lint.py

      - name: MSSP catalog in sync with Packs/ metadata
        run: python scripts/mssp_catalog.py --check

      - name: Artifact lock (require_lock rings)
        run: python scripts/lock.py --check

      - name: Pinned MSSP pack versions are released (or released by this merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_check.py

      - name: Config Overlays (registered List ids, patch shape)
        run: python scripts/config_overlay_lint.py

      - name: Ring policy (gate code from the base branch)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            BASE="$MG_BASE_SHA"; EXTRA=(--merge-group)
          else
            BASE="origin/$PR_BASE"; EXTRA=(--labels "$LABELS")
          fi
          GATE="$RUNNER_TEMP/ring_gate.py"
          git show "$BASE:scripts/ring_gate.py" > "$GATE" 2>/dev/null || : > "$GATE"
          if ! grep -q -- "--repo" "$GATE"; then
            # Only while adopting this change: the base branch still carries the
            # old gate, which can't judge another tree. Once merged, base always wins.
            echo "::warning::base branch has no base-aware ring_gate.py yet — using the PR's copy (bootstrap only)"
            GATE=scripts/ring_gate.py
          fi
          python "$GATE" --repo . --base "$BASE" "${EXTRA[@]}"
